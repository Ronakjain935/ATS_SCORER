services:
  - type: web
    name: ats-scorer-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "1"
